name: CI

on: [push, pull_request]

# Stated rather than inherited. CI runs a pull request's own build backend via
# `pip install -e ".[dev]"`, so the token it holds should be the minimum, and
# should not change because a repository default did.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Ruff lint
      run: ruff check epubconvert tests
    - name: Ruff format
      run: ruff format --check epubconvert tests
    - name: Mypy
      run: mypy
    - name: Pylint
      run: pylint epubconvert tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[portable]" pytest
    - name: Run tests
      run: pytest

  coverage:
    # One job on one interpreter. The test matrix would measure the same lines
    # five times, and test-minimal installs without extras so it cannot reach
    # the disarm-backed naming policy at all -- gating there would fail on code
    # that job is deliberately not allowed to import.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests with coverage
      # Threshold and sources both come from pyproject, so this is the same
      # command a developer runs locally.
      run: pytest --cov

  formal:
    # The TLA+ models in formal/, through TLC. Each configuration is held to an
    # expected outcome by tests/test_formal.py, including the two that must
    # fail, so a model that drifts into checking nothing turns this red too.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A fixed release, checked by digest. v1.8.0's asset is rebuilt nightly
      # under the same name, so pinning it would break on the next rebuild.
      TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest
    - name: Fetch TLC
      run: |
        jar="$RUNNER_TEMP/tla2tools.jar"
        curl -sSfL -o "$jar" "$TLA2TOOLS_URL"
        echo "$TLA2TOOLS_SHA256  $jar" | sha256sum --check
        echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
    - name: Model-check
      run: pytest tests/test_formal.py

  test-minimal:
    # Proves the default install stays pure standard library: no disarm, no
    # compiled wheel. The portable-naming tests skip themselves here.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install without extras
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest
    - name: Assert no third-party runtime dependency
      run: |
        if python -c "import disarm" 2>/dev/null; then
          echo "disarm leaked into the base install"; exit 1
        fi
    - name: Run tests
      run: pytest
