[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ibook2epub"
version = "2.0.0"
description = "Convert Apple iBooks epub packages to zipped epub files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Quinn" }]
keywords = ["epub", "ibooks", "apple", "ebook", "converter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Cross-filesystem filename sanitisation and case/accent-insensitive dedup.
# Optional so the default install stays pure standard library.
portable = ["disarm>=0.13"]
dev = [
    "pytest>=7.0",
    "pylint>=3.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ibook2epub[portable]",
]

[project.urls]
Homepage = "https://github.com/raeq/ibook2epub"
Issues = "https://github.com/raeq/ibook2epub/issues"

[project.scripts]
ibook2epub = "epubconvert.run:main"

[tool.setuptools]
packages = ["epubconvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pylint.main]
ignore-paths = ["^\\.?venv.*$"]

[tool.pylint."messages control"]
disable = ["duplicate-code"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
# Keyword-only options do not carry the readability cost this check targets;
# the positional limit stays at the default. Package is a data holder.
max-args = 8
# Report and Package are counter bags and parsed-document holders: attributes
# with no interactions between them, which is not the state this check exists
# to bound.
max-attributes = 12

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["venv*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "BLE", "FA"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures take pytest arguments by name; unused-argument and shadowing
# rules fight that convention rather than catching anything real.
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.10"
files = ["epubconvert", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Test bodies are assertions, not typed API surface; requiring annotations on
# every test function adds noise without adding safety.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# disarm is an optional extra; environments without it must still type-check.
module = "disarm"
ignore_missing_imports = true
