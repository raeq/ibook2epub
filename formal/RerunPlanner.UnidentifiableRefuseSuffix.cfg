\* UnidentifiableRefuse in suffix mode. Expected: ExportedMeansTheBooksOwnFile and NeverWritesOverAnotherBook hold -- each book moves on to a name of its own and is written there with its marker. The file from before markers is then listed as an orphan, as the old file of a book that takes its marker is.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = FALSE
    AllowRemovals = FALSE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- LegacyOfTwo
    AcceptMoved = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
