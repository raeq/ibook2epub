\* The same with --refresh. Expected: NeverWritesOverAnotherBook violated -- the newer edition is written over the deleted one's archive.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "skip"
    AllowMatch = FALSE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    VerifyHolder = FALSE
    ReadsSources = TRUE
    MoveOn = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NeverWritesOverAnotherBook
