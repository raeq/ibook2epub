\* SharedIdMarked with a book's archive found where it names a book no longer in the library and declares the identifier the book alone declares: a book moved to another folder. Expected: ExportedMeansTheBooksOwnFile violated -- the book that shared the identifier with one since deleted, with no file of its own -- a collision in skip mode, or not yet written in either -- is taken for that book moved and reported exported from its archive. A move cannot be written here; this is what the planner sees of one, and cannot tell from it.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {1, 2}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {1, 2}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- NoLegacy
    AcceptMoved = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    NoArchiveOfTheLibraryIsAnOrphan
