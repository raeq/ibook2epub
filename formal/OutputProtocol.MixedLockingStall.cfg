\* flock works for r1 only, and a live run can stall past the age. Expected: NoLiveWorkSwept is violated; the guard rests on that not happening.
CONSTANTS
    Runs = {r1, r2, r3}
    Books = {b1, b2}
    LockWorks = {r1}
    NoRun = NoRun
    AgeGuard = TRUE
    LiveMayStall = TRUE
    MaxKills = 2
SPECIFICATION Spec
INVARIANTS TypeOK OnlyCompleteBooks NoLiveWorkSwept MutualExclusion

