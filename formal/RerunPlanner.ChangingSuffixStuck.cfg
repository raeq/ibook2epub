\* ChangingSuffix without moving on: the code before placing.place. Expected: SuffixKeepsEveryIdentifiableBook violated -- a book whose name holds another edition's archive is a collision on every run.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = FALSE
    Copies = {}
    KeepOwn = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK SuffixKeepsEveryIdentifiableBook
