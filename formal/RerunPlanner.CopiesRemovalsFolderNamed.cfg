\* CopiesSuffix with books removed too, named from the folder. Expected: NoArchiveOfTheLibraryIsAnOrphan violated -- a package with nothing but its place to go by, numbered or moved on past another book's name, takes the number that book leaves, and its archive is an orphan.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
