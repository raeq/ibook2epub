\* CopiesSuffix with the two zipped books declaring one identifier: two copies of one book. Expected: all four properties hold.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = FALSE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {1, 2}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    SuffixKeepsEveryIdentifiableBook NoArchiveOfTheLibraryIsAnOrphan
