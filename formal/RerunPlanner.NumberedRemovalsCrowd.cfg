\* NumberedRemovals with three packages. Expected: NoArchiveOfTheLibraryIsAnOrphan violated -- the known limit: once the first leaves, two books with no usable identifier still want the name, and nothing says which numbered file is whose.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = FALSE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
    ReclaimOwn = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
