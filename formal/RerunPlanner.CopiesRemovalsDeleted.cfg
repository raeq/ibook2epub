\* CopiesRemovals with each book removed with its archive. Expected: NoArchiveOfTheLibraryIsAnOrphan violated -- a book that moved on to its marked name, past another book's archive under its plain name, takes the plain name back once that archive is deleted, and its marked archive is an orphan.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
