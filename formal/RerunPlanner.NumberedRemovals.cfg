\* Two packages of one name named from the folder, suffix mode, a library that starts whole and loses books with their archives. Expected: NoArchiveOfTheLibraryIsAnOrphan holds -- the numbered book keeps its number when the other leaves.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = FALSE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = FALSE
    RefuseAmbiguous = FALSE
    Legacy <- NoLegacy
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
