\* --match without the holder check: the code before it. Expected: ExportedMeansTheBooksOwnFile violated -- a book alone in a narrowed run takes another edition's name and is reported exported.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = FALSE
    AllowChanges = FALSE
    AllowRemovals = TRUE
    VerifyHolder = FALSE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
