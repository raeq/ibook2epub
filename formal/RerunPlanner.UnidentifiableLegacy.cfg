\* UnidentifiableMarked, with book 2's archive on the shelf under the plain name from before markers. Expected: ExportedMeansTheBooksOwnFile violated -- the limit that remains: once book 2 leaves the library, a book alone in wanting its unmarked file takes it by the name (and --refresh writes over it).
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- LegacyOfTwo
    AcceptMoved = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
