\* CopiesRemovalsDeleted with copy 1 declaring no usable identifier, so nothing but its own bytes tells its file from the package's archive. Expected: all four properties hold. With the archive left on the shelf when copy 1 leaves the library, the package takes the name and is reported exported from it: the Unidentifiable limit.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    SuffixKeepsEveryIdentifiableBook NoArchiveOfTheLibraryIsAnOrphan
