\* A package with no usable identifier, and an identified book whose title looks like its name numbered, suffix mode, named from the folder: the identified book leaves the library and its archive stays. Expected: ExportedMeansTheBooksOwnFile and NoArchiveOfTheLibraryIsAnOrphan hold -- the unidentified book keeps no numbered file that declares an identifier.
CONSTANTS
    N = 2
    Wanted <- NumberedLookalike
    Usable = {1}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = FALSE
    RefuseAmbiguous = FALSE
    Legacy <- NoLegacy
    AcceptMoved = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NoArchiveOfTheLibraryIsAnOrphan
