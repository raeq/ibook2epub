\* Books added and removed, without the holder check. Expected: ExportedMeansTheBooksOwnFile violated -- the next edition takes a deleted one's name and is reported exported.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "skip"
    AllowMatch = FALSE
    AllowRefresh = FALSE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = FALSE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
