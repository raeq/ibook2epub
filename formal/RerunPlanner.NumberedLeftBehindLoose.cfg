\* NumberedLeftBehind without AskNumbered. Expected: ExportedMeansTheBooksOwnFile violated -- the unidentified book kept the numbered file the identified book left behind, was reported exported from it and never written, and that archive was not listed as an orphan.
CONSTANTS
    N = 2
    Wanted <- NumberedLookalike
    Usable = {1}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NoArchiveOfTheLibraryIsAnOrphan
