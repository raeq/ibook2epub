\* CopiesUnidentified in skip mode. Expected: all four properties hold; the package that wants the copy's file loses its name.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {2, 3}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    SuffixKeepsEveryIdentifiableBook NoArchiveOfTheLibraryIsAnOrphan
