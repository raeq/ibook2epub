\* CopiesOneIdentifier without KeepOne. Expected: NoArchiveOfTheLibraryIsAnOrphan violated -- a copy took the package's archive, or the other copy's file, for its own, and its own file was listed as an orphan.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = FALSE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {1, 2, 3}
    KeepOne = FALSE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
