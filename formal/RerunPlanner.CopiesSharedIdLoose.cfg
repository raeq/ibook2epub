\* CopiesSharedId without KeepOne: the claim pass that let two copies keep one file. Expected: ExportedMeansTheBooksOwnFile violated -- a copy added beside another of its identifier is taken as copied, at the other's file.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = FALSE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {1, 2}
    KeepOne = FALSE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
