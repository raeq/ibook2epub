\* CopiesSuffix with books removed too, their archives left on the shelf. Expected: NoArchiveOfTheLibraryIsAnOrphan holds -- a numbered package keeps its number when a book of its name leaves.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
