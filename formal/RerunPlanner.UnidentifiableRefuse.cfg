\* Two books of one name that declare no usable identifier, book 2's archive on the shelf from before markers, a fixed library, skip mode. Expected: all three properties hold -- neither book is given the file, and it is not listed as an orphan.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = FALSE
    AllowRemovals = FALSE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- LegacyOfTwo
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    NoArchiveOfTheLibraryIsAnOrphan
