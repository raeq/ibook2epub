\* CopiesRemovals without KeepNumbered. Expected: NoArchiveOfTheLibraryIsAnOrphan violated -- a package moved on past a copy's file takes the name back once the copy leaves, and its own archive is an orphan.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = FALSE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
