\* Unidentifiable, with every archive a run writes naming its source, and books that nothing tells apart refused a file none of them marks. Expected: ExportedMeansTheBooksOwnFile, NeverWritesOverAnotherBook and NoArchiveOfTheLibraryIsAnOrphan hold -- the marker tells the books apart where the identifiers cannot.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- NoLegacy
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    NoArchiveOfTheLibraryIsAnOrphan
