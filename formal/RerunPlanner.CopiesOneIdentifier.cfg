\* CopiesSuffix with the package and both zipped books declaring one identifier: a package and two copies of one book. Expected: SuffixKeepsEveryIdentifiableBook and NoArchiveOfTheLibraryIsAnOrphan hold. The other two do not, as for any two books sharing an identifier.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = FALSE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {1, 2, 3}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = FALSE
    RefuseAmbiguous = FALSE
    Legacy <- NoLegacy
    AcceptMoved = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK SuffixKeepsEveryIdentifiableBook NoArchiveOfTheLibraryIsAnOrphan
