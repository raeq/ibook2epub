\* SharedIdMarked without markers. Expected: ExportedMeansTheBooksOwnFile violated -- once one leaves, the other is reported exported from its archive by the identifier they share.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {1, 2}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {1, 2}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = FALSE
    RefuseAmbiguous = FALSE
    Legacy <- NoLegacy
    AcceptMoved = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
