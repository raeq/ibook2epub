\* NumberedRemovalsCrowd with every archive a run writes naming its source. Expected: NoArchiveOfTheLibraryIsAnOrphan holds -- each numbered file says whose it is.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = FALSE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- NoLegacy
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
