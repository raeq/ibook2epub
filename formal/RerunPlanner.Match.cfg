\* Runs narrowed by --match. Expected: violated. A narrowed run names only the books it selected, so a book alone in it takes the name another edition's archive already has, and is reported exported. Open defect.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = FALSE
    AllowChanges = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
