\* CopiesUnidentified without ReclaimOwn. Expected: ExportedMeansTheBooksOwnFile violated -- a package added beside a copy the claim pass kept at its own bytes was placed at that file too, and reported exported from it.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = TRUE
    ReclaimOwn = FALSE
    AskNumbered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    SuffixKeepsEveryIdentifiableBook NoArchiveOfTheLibraryIsAnOrphan
