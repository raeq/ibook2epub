\* With the check, but books 2 and 3 carry no usable identifier. Expected: ExportedMeansTheBooksOwnFile violated. The known limit: with nothing to compare, the name decides.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    VerifyHolder = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
