\* The same, for what a run reports. Expected: ExportedMeansTheBooksOwnFile violated. The known limit: a book reported exported is not checked, because that would read every source on every rerun.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile
