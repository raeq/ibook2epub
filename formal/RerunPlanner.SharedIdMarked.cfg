\* Two packages of one name that share one identifier, named from their metadata, books added and removed, archives left. Expected: all three properties hold -- each archive's marker says which of the two it holds.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {1, 2}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {1, 2}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- NoLegacy
    AcceptMoved = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    NoArchiveOfTheLibraryIsAnOrphan
