\* Named from the folder (the default, strip, romanize), three packages sharing a folder name, checked only before a write. Expected: NeverWritesOverAnotherBook holds.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "skip"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NeverWritesOverAnotherBook
