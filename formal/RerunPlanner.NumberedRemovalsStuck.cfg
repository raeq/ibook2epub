\* NumberedRemovals without KeepNumbered. Expected: NoArchiveOfTheLibraryIsAnOrphan violated -- the numbered book takes the plain name the other left, is written again, and its archive is an orphan.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = FALSE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {}
    KeepOne = TRUE
    KeepNumbered = FALSE
    TakesArchive = TRUE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
