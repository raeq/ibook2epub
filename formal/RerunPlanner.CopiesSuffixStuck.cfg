\* CopiesSuffix without KeepOwn: the claim pass before a copy kept its own file in suffix mode. Expected: NoArchiveOfTheLibraryIsAnOrphan violated -- a copy on the shelf before another book of its name arrived is copied again under a number, and its file listed as an orphan.
CONSTANTS
    N = 3
    Wanted <- OneTitle
    Usable = {1, 2, 3}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = FALSE
    VerifyHolder = TRUE
    ReadsSources = FALSE
    MoveOn = TRUE
    Copies = {1, 2}
    KeepOwn = FALSE
    SharedId = {}
    KeepOne = FALSE
    KeepNumbered = FALSE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoArchiveOfTheLibraryIsAnOrphan
