\* SharedIdMarked in suffix mode, where the two take one digest-marked name, numbered. Expected: ExportedMeansTheBooksOwnFile, NeverWritesOverAnotherBook and SuffixKeepsEveryIdentifiableBook hold -- each keeps the number its marker names when the other leaves. A book entering the crowd takes the marked name and leaves its old file an orphan, by design.
CONSTANTS
    N = 2
    Wanted <- OneTitle
    Usable = {1, 2}
    OnCollision = "suffix"
    AllowMatch = TRUE
    AllowRefresh = TRUE
    AllowChanges = TRUE
    AllowRemovals = TRUE
    VerifyHolder = TRUE
    ReadsSources = TRUE
    MoveOn = TRUE
    Copies = {}
    KeepOwn = TRUE
    SharedId = {1, 2}
    KeepOne = TRUE
    KeepNumbered = TRUE
    TakesArchive = FALSE
    ReclaimOwn = TRUE
    AskNumbered = TRUE
    KeepShared = TRUE
    SourceMarked = TRUE
    RefuseAmbiguous = TRUE
    Legacy <- NoLegacy
    AcceptMoved = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK ExportedMeansTheBooksOwnFile NeverWritesOverAnotherBook
    SuffixKeepsEveryIdentifiableBook
